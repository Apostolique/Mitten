name: Release to itch.io

on:
  push:
    tags:
    - 'v*'

env:
  ITCH_USER_NAME: apos
  ITCH_GAME_NAME: mitten
  DESKTOP_PATH: Platforms/DesktopGL
  WEB_PATH: Platforms/BlazorGL.KNI

jobs:
  windows-linux-web:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        # The desktop builds target net9.0; the KNI web build targets net8.0.
        dotnet-version: |
          8.0.x
          9.0.x
    - name: Get version from tag
      run: |
        TAGVERSION=$(git describe --tags --abbrev=0)
        echo "TAGVERSION=${TAGVERSION:1}" >> $GITHUB_ENV
    - name: Build Windows
      run: dotnet publish ${{ env.DESKTOP_PATH }} -r win-x64 -c Release --output artifacts/windows --self-contained -p:Version=${{ env.TAGVERSION }}
    - name: Build Linux
      run: dotnet publish ${{ env.DESKTOP_PATH }} -r linux-x64 -c Release --output artifacts/linux --self-contained -p:Version=${{ env.TAGVERSION }}
    - name: Build Web
      run: dotnet publish ${{ env.WEB_PATH }} -c Release --output artifacts/web -p:Version=${{ env.TAGVERSION }}
    - name: Publish Windows build to itch.io
      uses: yeslayla/butler-publish-itchio-action@master
      env:
        BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
        CHANNEL: windows
        ITCH_GAME: ${{ env.ITCH_GAME_NAME }}
        ITCH_USER: ${{ env.ITCH_USER_NAME }}
        PACKAGE: artifacts/windows
        VERSION: ${{ env.TAGVERSION }}
    - name: Publish Linux build to itch.io
      uses: yeslayla/butler-publish-itchio-action@master
      env:
        BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
        CHANNEL: linux
        ITCH_GAME: ${{ env.ITCH_GAME_NAME }}
        ITCH_USER: ${{ env.ITCH_USER_NAME }}
        PACKAGE: artifacts/linux
        VERSION: ${{ env.TAGVERSION }}
    # itch.io marks a build playable in the browser when the channel name says
    # html, and it serves the index.html sitting at the root of the package, so
    # what goes up is the contents of wwwroot and nothing above it.
    - name: Publish Web build to itch.io
      uses: yeslayla/butler-publish-itchio-action@master
      env:
        BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
        CHANNEL: html5
        ITCH_GAME: ${{ env.ITCH_GAME_NAME }}
        ITCH_USER: ${{ env.ITCH_USER_NAME }}
        PACKAGE: artifacts/web/wwwroot
        VERSION: ${{ env.TAGVERSION }}

  # Assembling the bundle needs codesign, which only exists on macOS, and an
  # unsigned Mach-O is killed on launch by Apple Silicon.
  osx-build:

    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    - name: Get version from tag
      run: |
        TAGVERSION=$(git describe --tags --abbrev=0)
        echo "TAGVERSION=${TAGVERSION:1}" >> $GITHUB_ENV
    - name: Build Osx
      run: ./Platforms/DesktopGL/package-osx.sh ${{ env.TAGVERSION }} artifacts/osx
    # upload-artifact zips, and zip drops the executable bit off the launcher
    # and both app hosts. tar carries the modes through intact.
    - name: Pack bundle for transport
      run: tar -czf osx.tar.gz -C artifacts/osx Mitten.app
    - uses: actions/upload-artifact@v4
      with:
        name: osx
        path: osx.tar.gz
        if-no-files-found: error
        retention-days: 1

  # butler-publish-itchio-action is a Docker action and GitHub only runs those on
  # Linux, so the finished bundle comes back to Ubuntu to be pushed.
  osx-publish:

    runs-on: ubuntu-24.04
    needs: osx-build

    steps:
    - name: Get version from tag
      run: echo "TAGVERSION=${GITHUB_REF_NAME:1}" >> $GITHUB_ENV
    - uses: actions/download-artifact@v4
      with:
        name: osx
    - name: Unpack bundle
      run: |
        mkdir -p artifacts/osx
        tar -xzf osx.tar.gz -C artifacts/osx
    - name: Publish OSX build to itch.io
      uses: yeslayla/butler-publish-itchio-action@master
      env:
        BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
        CHANNEL: osx
        ITCH_GAME: ${{ env.ITCH_GAME_NAME }}
        ITCH_USER: ${{ env.ITCH_USER_NAME }}
        PACKAGE: artifacts/osx
        VERSION: ${{ env.TAGVERSION }}
